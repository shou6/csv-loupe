name: Release

# v0.1.0 のようなタグを push すると、全チェックを通してから VSIX を GitHub Release に添付する。
#
# Marketplace への公開はここでは行わない。添付された VSIX を管理画面から手でアップロードする。
# 理由: vsce の PAT による公開は 2026-12-01 の Azure DevOps の
# global PAT 廃止で使えなくなり、後継の Entra ID 方式は Azure 側の設定が必要なため。
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NAME=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

      - run: npm run format:check
      - run: npm run compile
      - run: npm run lint:md
      - name: Unit and integration tests
        run: xvfb-run -a npm test

      - name: Package
        run: npx vsce package --out "$NAME-$VERSION.vsix"
      - name: Verify package contents
        run: node scripts/verify-package.js "$NAME-$VERSION.vsix"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$NAME-$VERSION.vsix" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." \
            --verify-tag
